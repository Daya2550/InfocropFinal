{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Farmer Registration</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="split-group" style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label for="name">First Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="surname">Last Name</label>
                <input type="text" id="surname" name="surname" required>
            </div>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="split-group" style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group" style="width: 100px;">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" required>
            </div>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" style="width: 100%; max-width: 100%; background-color: #3d3d3d; border: 1px solid #4d4d4d; border-radius: 8px; color: white; padding: 0.8rem;"></textarea>
        </div>

        <div class="form-group">
            <label for="identity_proof">Identity Proof (PDF/Image)</label>
            <input type="file" id="identity_proof" name="identity_proof" accept="image/*,.pdf" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Create Account</button>
    </form>
    <p style="margin-top: 1rem; text-align: center; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary-color);">Login here</a>
    </p>
</div>
{% endblock %}
